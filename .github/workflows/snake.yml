name: Refresh contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1,4'

permissions:
  contents: write

jobs:
  update-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Render real GitHub contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: GrimVeqsum
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#58b4ff&color_dots=#0c1524,#173252,#225483,#368aca,#6ec5ff

      - name: Commit new contribution animation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/snake.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update contribution snake'
            git push
          fi
